<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale | default "en" }}">
  {{ partial "head.html" . }}
  <body>
    {{ partial "header.html" . }}

    <div class="main-wrapper">
      {{ block "main" . }}{{ end }}
    </div>

    {{ partial "footer.html" . }}
    {{ partial "lightbox.html" . }}

    <!-- Cinematic Custom Cursor & Ambient Lighting Elements -->
    <div class="ambient-cursor-spotlight" id="ambientSpotlight" aria-hidden="true"></div>
    <div class="cinematic-cursor" id="cinematicCursor" aria-hidden="true">
      <div class="cursor-dot" id="cursorDot"></div>
      <div class="cursor-ring" id="cursorRing">
        <span class="cursor-badge" id="cursorBadge"></span>
      </div>
    </div>

    {{ $js := resources.Get "js/main.js" | resources.Minify }}
    <script src="{{ $js.RelPermalink }}" defer></script>
  </body>
</html>
